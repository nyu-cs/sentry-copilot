[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentry-copilot"
version = "0.1.0"
description = "Replay-first, read-only assistant framework for Arknights Sentry Protocol."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
  "mss>=10,<11",
  "numpy>=1.26",
  "opencv-python>=4.10",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "winrt-Windows.Foundation>=3.2,<4; sys_platform == 'win32'",
  "winrt-Windows.Globalization>=3.2,<4; sys_platform == 'win32'",
  "winrt-Windows.Graphics.Imaging>=3.2,<4; sys_platform == 'win32'",
  "winrt-Windows.Media.Ocr>=3.2,<4; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams>=3.2,<4; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.2",
  "ruff>=0.6",
]

[project.scripts]
sentry-copilot = "sentry_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentry_copilot = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/sentry_copilot"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["cv2", "yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "winrt.windows.globalization",
  "winrt.windows.graphics.imaging",
  "winrt.windows.media.ocr",
  "winrt.windows.storage.streams",
]
ignore_missing_imports = true
